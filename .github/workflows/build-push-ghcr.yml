# T115 — CI: build efactory:linux, smoke-test, push в GHCR.
#
# Триггеры:
#   - push в main → build + test + push с tag'ами linux-latest, linux-<sha>
#   - push версионного тага (например `0.7.0`) → дополнительно tag linux-<ver>
#   - workflow_dispatch → ручной запуск (для отладки)
#
# Acceptance per BACKLOG T115: после первого успешного run
# `docker pull ghcr.io/vlakir/efactory:linux-latest` работает на любой машине
# с авторизацией к GHCR (публичный repo — без авторизации).
#
# Image weight: ~7.3 GB (KiCad + FreeCAD + ngspice + getdp + gmsh + Python +
# uv venv). Runner ubuntu-latest имеет 14 GB disk free после aggressive
# cleanup (см. Free runner disk step) — этого хватает с запасом.
#
# Кеш: registry-based `linux-buildcache` tag в том же image repo —
# инкрементальные ребилды быстрее (apt layer не пересобирается, если не
# поменялся Dockerfile head).

name: build-push-ghcr

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-push-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/efactory

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        # ubuntu-latest имеет ~14 GB свободного места до cleanup.
        # 7.3 GB image + 5+ GB buildkit working space → tight. Удаляем
        # preinstalled toolchains, которые мы не используем (Android,
        # .NET, CodeQL DB), и pruneим Docker cache.
        run: |
          set -eu
          echo "::group::Disk before cleanup"
          df -h /
          echo "::endgroup::"
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /usr/local/share/powershell
          docker system prune -af --volumes || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          echo "::group::Disk after cleanup"
          df -h /
          echo "::endgroup::"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -eu
          SHA_SHORT="${GITHUB_SHA::7}"
          TAGS="${IMAGE}:linux-${SHA_SHORT}"
          # Update floating linux-latest tag only on main pushes
          # (а так же на тагах — final release artefact).
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAGS+=",${IMAGE}:linux-latest"
          fi
          # Tag-driven release → дополнительный version-specific tag
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS+=",${IMAGE}:linux-${VERSION}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build (load locally, with GHCR registry cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: efactory:ci
          cache-from: type=registry,ref=${{ env.IMAGE }}:linux-buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:linux-buildcache,mode=max

      - name: Smoke test inside built image
        # Minimal smoke per BACKLOG T115: версии всех CLI инструментов
        # отвечают + unit tests зелёные. ERC / OP / FreeCAD headless
        # full-fixture-runs могут быть добавлены follow-up (T<NEW>):
        # сейчас фикстуры для них живут в tests/fixtures и пройдут
        # автоматически через unit/integration pytest layer.
        run: |
          set -eu
          docker run --rm efactory:ci bash -c '
            set -eu
            echo "=== tool versions ==="
            python --version
            kicad-cli version
            ngspice --version 2>&1 | head -1
            gmsh --version 2>&1 | head -1
            getdp --version 2>&1 | head -1
            freecadcmd --version 2>&1 | head -3 || echo "freecadcmd: header-only or missing"
            echo
            echo "=== pytest unit + domain ==="
            uv run pytest tests/unit -q --no-cov --tb=line 2>&1 | tail -15
          '

      - name: Tag + push to GHCR
        # Push только если smoke passed. Pull request runs не пушат
        # (workflow триггерится только на main/tag/dispatch — по
        # триггер-конфигу выше, на PR не запускается).
        #
        # GitHub Actions interpolates `${{ steps.tags.outputs.tags }}`
        # в literal shell text ДО bash evaluation. Bash IFS=',' word-
        # splitting применяется только к variable EXPANSIONS, не к
        # literal-text-словам — поэтому literal `for T in a,b,c` даёт
        # ОДНО слово "a,b,c", а не три. Fix: сначала assign к
        # переменной, потом `read -ra` в array с IFS=','.
        run: |
          set -eu
          TAGS_RAW='${{ steps.tags.outputs.tags }}'
          IFS=',' read -ra TAGS_ARR <<< "${TAGS_RAW}"
          for TAG in "${TAGS_ARR[@]}"; do
            echo "::group::Pushing ${TAG}"
            docker tag efactory:ci "${TAG}"
            docker push "${TAG}"
            echo "::endgroup::"
          done

      - name: Image summary
        if: always()
        run: |
          set -eu
          docker images efactory:ci --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}" || true
          echo
          docker images "${IMAGE}" --format "table {{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.Size}}" || true
