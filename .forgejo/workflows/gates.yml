name: gates

# Гейты проекта на srv: тот же `scripts/gates.sh`, что у разработчика перед push, —
# ruff check, ruff format --check, mypy, pytest с порогом покрытия ≥80% на src/.
# Идут в одноразовом клоне (srv-ci T026): диспетчер запускает `srv-gates-run`, образ из
# `ci/forgejo/Dockerfile` и снимок кэша uv по `uv.lock` хранятся на общем каталоге srv.
# Прежние Docker-задания — в ручном `gates-docker.yml`.
on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  gates:
    runs-on: clone
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # токен задания не должен попасть в src.tgz

      # Клон 4 vCPU / 8 ГБ, контейнеру гейтов — прежние 4 ГБ без swap.
      - name: Гейты в клоне
        run: |
          srv-gates-run run --project efactory \
            --clone-cores 4 --clone-memory 8192 --timeout 3300 \
            --job-memory 4g --job-cpus 4

      - uses: forgejo/upload-artifact@v4
        if: always()
        with:
          name: gates-out
          path: gates-out/
